# Current Megado template keys retained. Coordinator-readable contract, not a scheduler.
# Role responsibilities are fixed; roles contains independently replaceable bindings.
mode: planning_only
roles:
  coordinator:
    model: gpt-5.6-luna
    reasoning: medium
  worker_normal:
    model: gpt-5.6-luna
    reasoning: medium
  worker_xhard:
    model: gpt-5.6-sol
    reasoning: high
  reviewer_normal:
    model: gpt-6-astra
    reasoning: medium
  reviewer_xhard:
    model: gpt-5.6-sol
    reasoning: high
  oracle:
    model: gpt-6-astra
    reasoning: high
  final_reviewer:
    model: gpt-6-astra
    reasoning: medium
oracle:
  max_calls: 7
review_stages:
- id: save_export_completion
  after: S1_READY
  reviewer_role: reviewer_normal
  lens: completion
  scope_tasks:
  - C0
  - T0
  - T1
  - T2
  criteria_source: acceptance-ledger.md
  criteria:
  - I1
  - I2
  - I3
  - I7
  max_rounds: 2
- id: final
  after: ALL_REQUIRED_WORK_AND_TESTS
  reviewer_role: final_reviewer
  lens: completion_and_strategy
  scope_tasks:
  - C0
  - T0
  - T1
  - T2
  - T3
  - T4
  criteria_source: acceptance-ledger.md
  criteria:
  - I1
  - I2
  - I3
  - I4
  - I5
  - I6
  - I7
  max_rounds: 3
review_budget:
  max_calls: 10
  historical_calls: 5
  future_stage_max_calls: 5
  count_rule: Every independent reviewer invocation counts, including UNKNOWN, failed/lost attempts, correction
    rounds and restarts. No new allowance from renaming/repackaging or XHARD replacement. No additional implicit
    final stage.
budget_adoption:
  authority: Current user request to adopt current Megado defaults while preserving agreed two Astra boundaries
    and all completed work.
  historical_oracle_calls: 4
  prospective_oracle_allowance: 3
  historical_review_calls: 5
  prospective_review_allowance: 5
  note: Lifetime totals are 4+3 oracle and 5+5 review, not reset-to-zero counters. Prospective allowances are ceilings
    for future work only. The current planning-only update dispatches no review or oracle. Historical final/v2 mixed
    judgments are conservatively charged to both budgets.
binding_notes:
  reviewer_normal: Astra medium overrides Luna default to retain the explicitly agreed Astra save/export checkpoint;
    classification stays normal.
  oracle: Astra high retains the designated consequential judgment owner; not automatic review after PASS.
  final_reviewer: Astra medium default also preserves agreed final Astra checkpoint.
  other_slots: Template defaults retained. Binding edits do not switch this host or existing agents.
  xhard: No current XHARD assignments. Sol slots reserved for an irreducible worker/reviewer question under the
    existing user XHARD choice. Replacement uses the same stage budget; uncertain routing goes to oracle, never
    an extra panel.
review_contract:
  packet_template: review-packet-template.md
  assembly_source: plan.md#review-packet-assembly
  counts_source: status.md
  planning_dispatch: none; future stages are dormant until explicit delivery authorization
  restart_policy: Write attempt ID and debit count before dispatch. Recover lost results or conservatively keep
    charge. Counters survive crashes, stage renames, candidate changes and coordinator/model replacements.
  stage_failure: Only contract_violation, implementation_defect, required_evidence_gap may block. Fix and test before
    delta review. Gate never passes with missing required proof.
  cap_policy: At stage or total cap, no extra review; continue independent or authorized corrections, request oracle
    diagnosis if budget remains, and seek only required user budget/authority change. Never bypass gate.
role_responsibilities:
  coordinator: Run the authorized process, brief/dispatch tasks, collect exact evidence, maintain counters, apply
    uncontested gates and prescribed corrections; escalate consequential judgment; no scope/budget/authority waivers.
  worker_normal: Implement assigned bounded outcome and focused tests; report evidence and propose alternatives
    without silently changing scope. No implementation in planning_only.
  worker_xhard: Same worker responsibility, only an irreducible XHARD assignment; not an authority promotion.
  reviewer_normal: Independent leaf completion review of the declared stage scope and evidence; report classified
    findings; never review own implementation or change scope.
  reviewer_xhard: Same independent reviewer responsibility for a justified irreducible hard question; replaces assignment
    within the same scope and cap, never adds a stage.
  oracle: Own consequential adjudication and permitted in-scope exceptions under user authority; respond to concrete
    decision requests; never waive demonstrated failure or reset budgets.
  final_reviewer: Independent whole-candidate completion and strategic review of integration, simplicity and North
    Star; report source-backed findings, not scope authority.
