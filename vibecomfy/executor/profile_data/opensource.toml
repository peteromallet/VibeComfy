# Open-source / OpenRouter profile for vibecomfy-executor.
#
# Routes through OpenRouter using the Arnold "hermes" agent family.
# Classify stays on DeepSeek V4 Flash; research and implementation use the
# stronger Kimi K2.7 Code route, while reply stays on DeepSeek V4 Pro.
[profiles.opensource]
classify   = "hermes:openrouter:deepseek/deepseek-v4-flash-0731"
research   = "hermes:openrouter:moonshotai/kimi-k2.7-code"
implement  = "hermes:openrouter:moonshotai/kimi-k2.7-code"
reply      = "hermes:openrouter:deepseek/deepseek-v4-pro"
execute    = "hermes:openrouter:deepseek/deepseek-v4-flash-0731"
