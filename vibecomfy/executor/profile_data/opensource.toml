# Open-source / OpenRouter profile for vibecomfy-executor.
#
# Routes through OpenRouter using the Arnold "hermes" agent family.
# Every stage uses the same pinned DeepSeek V4 Flash revision so behavior and
# telemetry remain comparable across the staged pipeline.
[profiles.opensource]
classify   = "hermes:openrouter:deepseek/deepseek-v4-flash-0731"
research   = "hermes:openrouter:deepseek/deepseek-v4-flash-0731"
implement  = "hermes:openrouter:deepseek/deepseek-v4-flash-0731"
reply      = "hermes:openrouter:deepseek/deepseek-v4-flash-0731"
