# OpenAI Codex profile for vibecomfy-executor.
#
# Uses OpenAI's Codex Responses API via the Arnold "codex" agent family.
# The routing adjudicator uses the cost-efficient Luna tier. Substantive Codex
# stages use the flagship Sol tier, all at medium reasoning effort.
[profiles.openai]
classify   = "codex:gpt-5.6-luna:medium"
research   = "codex:gpt-5.6-sol:medium"
implement  = "codex:gpt-5.6-sol:medium"
execute    = "codex:gpt-5.6-sol:medium"
reply      = "codex:gpt-5.6-sol:medium"
