base_branch: main

anchors:
  north_star: NORTHSTAR.md

milestones:
  - label: m1-layout-contract-and-facts
    idea: .megaplan/initiatives/reorganise-comfy-workflow/briefs/m1-layout-contract-and-facts.md
    branch: epic/reorganise-comfy-workflow/m1-layout-contract-and-facts
    profile: partnered-4
    robustness: full
    depth: high
    with_prep: true
    prep_direction: "Focus on the lossless LiteGraph substrate, scoped identity, graph-fact extraction, strict LayoutPlan schema, Set/Get effective virtual links, and assessment metrics. Do not implement coordinate layout yet."

  - label: m2-semantic-layout-compiler
    idea: .megaplan/initiatives/reorganise-comfy-workflow/briefs/m2-semantic-layout-compiler.md
    branch: epic/reorganise-comfy-workflow/m2-semantic-layout-compiler
    profile: partnered-4
    robustness: full
    depth: high
    with_prep: true
    prep_direction: "Focus on turning validated semantic sections into deterministic coordinates, groups, colors, title/bounding boxes, overlap resolution, and aesthetic metrics. Treat this as a new semantic layout compiler, not a thin wrapper over the existing topology engine."

  - label: m3-agent-skill-cli-preview
    idea: .megaplan/initiatives/reorganise-comfy-workflow/briefs/m3-agent-skill-cli-preview.md
    branch: epic/reorganise-comfy-workflow/m3-agent-skill-cli-preview
    profile: partnered-4
    robustness: full
    depth: high
    with_prep: true
    prep_direction: "Focus on the explicit /reorganise_comfy_workflow and CLI preview/apply surfaces, strict agent-output parsing, candidate graph production, report artifacts, and non-destructive apply gates."

  - label: m4-main-flow-rollout-and-goldens
    idea: .megaplan/initiatives/reorganise-comfy-workflow/briefs/m4-main-flow-rollout-and-goldens.md
    branch: epic/reorganise-comfy-workflow/m4-main-flow-rollout-and-goldens
    profile: partnered-4
    robustness: full
    depth: high
    with_prep: true
    prep_direction: "Focus on conservative main-flow suggestion-only integration, golden fixtures, browser/e2e validation, documentation, and rollout flags. Do not auto-apply reorganisation in normal agent-edit turns."

on_failure:
  abort: stop_chain
on_escalate:
  abort: stop_chain
merge_policy: review

driver:
  robustness: full
  auto_approve: true
  max_iterations: 80
  poll_sleep: 8.0
