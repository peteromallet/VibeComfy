# Auto-refreshing community node-schema corpus.
#
# Sweeps a bounded sample of ComfyUI custom-node packs (default: the known-good
# seed in vibecomfy.node_packs; or a network sample from the Comfy registry),
# extracts each via the static-AST + stubbed-import ladder, and commits the
# refreshed sharded corpus + coverage report back to the branch. Tags a dated
# release so consumers can pin a corpus snapshot.
#
# Scale caveat: a GitHub-hosted runner gives ~6h and NO GPU. Rung 1 (static AST)
# handles the majority of packs cheaply and is what this job runs; the ~6–10%
# of nodes that need a real ComfyUI boot (the "heavy boot" rung — install pip
# deps, boot, query /object_info) is deferred to a heavier job per the plan's
# findings (see tools/build_node_corpus.py::_HEAVY_BOOT_TODO). This Action NEVER
# boots ComfyUI and never installs untrusted pip deps; it only clones public
# source and parses it.
#
# Local dispatch via act:
#   act -W .github/workflows/refresh-node-schemas.yml \
#       -s GITHUB_TOKEN="$(gh auth token)" --container-architecture linux/amd64
name: Refresh node schemas

on:
  schedule:
    # Daily at 06:17 UTC (off-minute to avoid the cron rush).
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap the number of packs processed (0 = all known packs)"
        required: false
        default: "12"
      from_registry:
        description: "Network sample N packs from the Comfy registry (0 = use known seed)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Build node corpus
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          FROM_REGISTRY: ${{ github.event.inputs.from_registry }}
        run: |
          ARGS=""
          if [ "${FROM_REGISTRY:-0}" != "0" ] && [ -n "${FROM_REGISTRY}" ]; then
            ARGS="$ARGS --from-registry ${FROM_REGISTRY}"
          else
            if [ "${LIMIT:-12}" != "0" ] && [ -n "${LIMIT:-12}" ]; then
              ARGS="$ARGS --limit ${LIMIT:-12}"
            fi
          fi
          python tools/build_node_corpus.py $ARGS

      - name: Detect corpus changes
        id: diff
        run: |
          git add vibecomfy/porting/cache/object_info out/node_corpus_coverage.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed corpus
        if: steps.diff.outputs.changed == 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(schemas): auto-refresh node corpus ${DATE}

          Generated by the refresh-node-schemas Action from the daily cron.
          See out/node_corpus_coverage.json for per-pack yield."
          git push

      - name: Tag dated release
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          TAG="schemas-$(date -u +%Y%m%d)"
          TARGET="$(git rev-parse HEAD)"

          # A rerun may encounter a tag that was created before the job was
          # interrupted.  It is safe to treat that as success only when both
          # local and remote resolution prove that the tag names this commit.
          local_tag_exists=false
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            local_tag_exists=true
            local_target="$(git rev-parse "$TAG^{commit}")"
            if [ "$local_target" != "$TARGET" ]; then
              echo "ERROR: local tag $TAG points to $local_target, expected $TARGET" >&2
              exit 1
            fi
          fi

          # Query both the tag ref and its peeled commit so lightweight and
          # annotated tags are compared by the object they resolve to.  A
          # failed lookup is a real transport/authentication error, not an
          # indication that the tag is already present.
          remote_ref="$(git ls-remote origin "refs/tags/$TAG")" || {
            echo "ERROR: unable to inspect remote tag $TAG" >&2
            exit 1
          }
          remote_peeled_ref="$(git ls-remote origin "refs/tags/$TAG^{}")" || {
            echo "ERROR: unable to inspect peeled remote tag $TAG" >&2
            exit 1
          }
          remote_target="$(printf '%s\n' "$remote_peeled_ref" | awk 'NR == 1 { print $1 }')"
          if [ -z "$remote_target" ]; then
            remote_target="$(printf '%s\n' "$remote_ref" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -n "$remote_target" ]; then
            if [ "$remote_target" != "$TARGET" ]; then
              echo "ERROR: remote tag $TAG resolves to $remote_target, expected $TARGET" >&2
              exit 1
            fi
            echo "Tag $TAG already resolves to $TARGET; release is idempotent."
            exit 0
          fi

          if [ "$local_tag_exists" = false ]; then
            git tag "$TAG" "$TARGET"
          fi
          # Do not mask push failures: conflict, auth, and transport errors
          # must make the workflow fail.
          git push origin "refs/tags/$TAG"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-corpus-coverage
          path: out/node_corpus_coverage.json
          if-no-files-found: warn
